<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UNFV Digital</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-orange) 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    
    <div class="card form-container" style="width: 100%; max-width: 400px; text-align: center; margin: auto; padding: 40px;">
        <h2 style="color: var(--primary-blue); margin-bottom: 30px;">Acceso al Sistema</h2>
        
        <form id="loginForm">
            <div class="form-group" style="text-align: left;">
                <label>Usuario</label>
                <input type="text" id="username" required placeholder="admin">
            </div>
            <div class="form-group" style="text-align: left;">
                <label>Contraseña</label>
                <input type="password" id="password" required placeholder="********">
            </div>
            
            <p id="errorMsg" style="color: red; display: none; margin-bottom: 15px;"></p>
            
            <button type="submit" class="btn btn-orange" style="width: 100%; font-size: 1.1rem;">Ingresar</button>
        </form>
    </div>

    <script src="auth.js"></script>
</body>
</html>
